<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>워터메로니 - 미쳐가는 과일 합치기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#2b1c12; font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#fff; display:flex; align-items:center; justify-content:center; }

  #starfield{ position:absolute; inset:0; z-index:0; overflow:hidden; background:radial-gradient(ellipse at 50% -10%, #6b4226 0%, #40270f 45%, #1f1109 100%); }
  #starfield::before{ content:''; position:absolute; inset:0; opacity:0.5; background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 38px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 38px); }
  .star{ position:absolute; border-radius:50%; opacity:0.7; animation: twinkle 3s infinite ease-in-out; filter:drop-shadow(0 0 3px rgba(255,214,102,0.5)); }
  @keyframes twinkle{ 0%,100%{opacity:0.15;} 50%{opacity:0.9;} }

  #wrap{ position:relative; width:100%; height:100%; max-width:480px; max-height:900px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.7); background:transparent; z-index:1; }

  #topHud{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; z-index:5; min-height:50px; }
  #topHud .side{ display:flex; align-items:center; gap:8px; min-width:44px; }
  #backBtn, #muteBtnG, #restartBtn{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18);
    color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; padding:0; box-shadow:none; cursor:pointer;
  }
  #hudTitle{ font-size:15px; font-weight:800; text-align:center; flex:1; opacity:0.95; letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px; }
  #hudStat{ font-size:13px; font-weight:700; background:rgba(255,255,255,0.08); padding:6px 10px; border-radius:20px; white-space:nowrap; }

  #screens{ position:relative; flex:1; overflow:hidden; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding:6px 16px 24px; }
  .screen.active{ display:flex; }

  /* HUB */
  #screen-hub .hubTitle{ text-align:center; margin:8px 0 4px; }
  #screen-hub .hubTitle h1{ font-size:26px; background:linear-gradient(90deg,#ffd166,#ff922b,#ff6b6b,#ffa94d); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #screen-hub .hubTitle p{ font-size:12px; opacity:0.6; margin-top:2px; }
  #worldList{ display:flex; flex-direction:column; gap:14px; margin-top:14px; padding-bottom:20px; }
  .worldCard{
    position:relative; border-radius:20px; padding:16px 18px; display:flex; align-items:center; gap:14px;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    cursor:pointer; transition: transform 0.12s;
  }
  .worldCard:active{ transform:scale(0.97); }
  .worldCard.secretCard{ border:1px solid rgba(132,94,247,0.6); box-shadow:0 8px 24px rgba(0,0,0,0.35), 0 0 20px rgba(132,94,247,0.35); }
  .worldCard.locked{ opacity:0.45; filter:grayscale(0.6); }
  .planetIcon{
    width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow: inset -6px -6px 14px rgba(0,0,0,0.35), 0 0 20px rgba(255,255,255,0.15);
    flex-shrink:0;
  }
  .worldInfo{ flex:1; min-width:0; }
  .worldInfo h3{ font-size:16px; margin-bottom:2px; }
  .worldInfo p{ font-size:11.5px; opacity:0.65; }
  .worldStars{ font-size:12px; margin-top:6px; opacity:0.9; }
  .lockIcon{ position:absolute; top:10px; right:12px; font-size:16px; opacity:0.8; }

  /* STAGE SELECT */
  #screen-stages .stagesTitle{ text-align:center; margin:10px 0 2px; }
  #screen-stages .stagesTitle h2{ font-size:22px; }
  #screen-stages .stagesTitle p{ font-size:12px; opacity:0.6; margin-top:4px; }
  #stageMap{ display:flex; flex-direction:column; align-items:center; gap:0; margin-top:20px; padding-bottom:30px; position:relative; }
  .stageNodeWrap{ display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
  .stageConnector{ width:3px; height:34px; background:repeating-linear-gradient(180deg, rgba(255,255,255,0.35) 0 6px, transparent 6px 12px); }
  .stageNode{
    width:74px; height:74px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), rgba(255,255,255,0.02));
    border:2px solid rgba(255,255,255,0.25); font-size:22px; font-weight:900; cursor:pointer; position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .stageNode.locked{ opacity:0.35; cursor:default; }
  .stageNode .stars{ font-size:11px; margin-top:2px; letter-spacing:1px; }
  .stageNodeWrap:nth-child(4n+1) .stageNode{ transform: translateX(-58px); }
  .stageNodeWrap:nth-child(4n+2) .stageNode{ transform: translateX(-20px); }
  .stageNodeWrap:nth-child(4n+3) .stageNode{ transform: translateX(58px); }
  .stageNodeWrap:nth-child(4n) .stageNode{ transform: translateX(20px); }

  /* PLAY SCREEN */
  #screen-play{ padding:6px 10px 10px; }
  #playGoal{ text-align:center; font-size:12.5px; opacity:0.85; padding:4px 6px 10px; min-height:18px; }
  #playArea{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:16px; background:rgba(255,255,255,0.03); }
  #playArea canvas{ display:block; }

  /* generic grid puzzle styling */
  .pzGrid{ display:grid; gap:4px; touch-action:none; }
  .pzCell{
    display:flex; align-items:center; justify-content:center; border-radius:10px; font-weight:800;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); position:relative; transition: background 0.15s, transform 0.1s;
  }
  .pzCell.sel{ outline:3px solid #ffe066; outline-offset:-3px; }

  /* Result overlay */
  #resultOverlay{
    position:absolute; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(6,4,16,0.9);
  }
  #resultOverlay.show{ display:flex; }
  .resultCard{ text-align:center; padding:26px 30px; border-radius:22px; background:linear-gradient(160deg,#2c2450,#1a1530); box-shadow:0 20px 50px rgba(0,0,0,0.5); max-width:320px; }
  .resultCard h2{ font-size:24px; margin-bottom:6px; }
  .resultStars{ font-size:42px; margin:10px 0; letter-spacing:6px; }
  .resultStars span{ display:inline-block; filter:grayscale(1) opacity(0.3); transition: all 0.3s; }
  .resultStars span.on{ filter:none; animation: popStar 0.4s ease; }
  @keyframes popStar{ 0%{ transform:scale(0); } 60%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  .resultSub{ font-size:13px; opacity:0.75; margin-bottom:16px; }
  .resultBtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.pz-btn{
    font-family:inherit; font-weight:700; font-size:14px; padding:11px 20px; border-radius:30px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ff9a3c,#ff6b6b); color:#fff; box-shadow:0 6px 16px rgba(255,107,107,0.35);
  }
  button.pz-btn.secondary{ background:rgba(255,255,255,0.12); box-shadow:none; }
  button.pz-btn:active{ transform:scale(0.95); }

  ::-webkit-scrollbar{ width:0; height:0; }

  /* LOBBY */
  .lobbyWrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:10px; padding:20px; }
  .lobbyFruitDeco{ font-size:34px; letter-spacing:4px; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4)); }
  .lobbyTitle{ font-size:44px; font-weight:900; background:linear-gradient(90deg,#ffd166,#ff922b,#ff6b6b,#ffa94d); -webkit-background-clip:text; background-clip:text; color:transparent; margin-top:4px; }
  .lobbySub{ font-size:14px; opacity:0.7; margin-bottom:6px; }
  .lobbyBest{ font-size:13px; background:rgba(255,255,255,0.08); padding:8px 16px; border-radius:20px; margin-bottom:14px; }
  .lobbyBtns{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:260px; }
  .lobbyBtn{ width:100%; padding:15px; font-size:16px; }

  /* SETTINGS */
  #fruitEditGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(78px,1fr)); gap:12px; margin-top:14px; padding-bottom:20px; }
  .fruitEditTile{ display:flex; flex-direction:column; align-items:center; gap:6px; background:rgba(255,255,255,0.06); border-radius:14px; padding:10px 6px; cursor:pointer; border:1px solid rgba(255,255,255,0.1); }
  .fruitEditTile:active{ transform:scale(0.95); }
  .fruitEditTile canvas{ border-radius:50%; background:rgba(255,255,255,0.05); }
  .fruitEditTile span{ font-size:11px; opacity:0.85; }

  /* PAINT MODAL */
  #paintOverlay{ position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(6,4,16,0.92); }
  #paintOverlay.show{ display:flex; }
  .paintCard{ text-align:center; padding:22px 26px; border-radius:22px; background:linear-gradient(160deg,#2c2450,#1a1530); box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  #paintCanvas{ background:#fff; border-radius:50%; touch-action:none; margin:12px 0; box-shadow:0 6px 20px rgba(0,0,0,0.4); }
  #paintPalette{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; max-width:220px; margin:0 auto 12px; }
  .paintSwatch{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); cursor:pointer; }
  .paintSwatch.on{ border-color:#fff; transform:scale(1.15); }
</style>
</head>
<body>
<div id="starfield"></div>
<div id="wrap">
  <div id="topHud">
    <div class="side"><button id="backBtn" style="display:none;">←</button></div>
    <div id="hudTitle">워터메로니</div>
    <div class="side" style="justify-content:flex-end;">
      <div id="hudStat" style="display:none;"></div>
      <button id="restartBtn" style="display:none;">⟳</button>
      <button id="muteBtnG">🔊</button>
    </div>
  </div>

  <div id="screens">
    <section id="screen-lobby" class="screen active">
      <div class="lobbyWrap">
        <div class="lobbyFruitDeco">🍉🍊🍋🍇🍑</div>
        <h1 class="lobbyTitle">워터메로니</h1>
        <p class="lobbySub">과일을 합쳐라!</p>
        <div class="lobbyBest">🏆 무한모드 최고 기록: <span id="lobbyBestScore">0</span></div>
        <div class="lobbyBtns">
          <button id="lobbyPlayBtn" class="pz-btn lobbyBtn">▶ 플레이</button>
          <button id="lobbyInfiniteBtn" class="pz-btn secondary lobbyBtn">🌀 무한모드</button>
          <button id="lobbySettingsBtn" class="pz-btn secondary lobbyBtn">⚙️ 설정</button>
        </div>
      </div>
    </section>

    <section id="screen-settings" class="screen">
      <div class="hubTitle">
        <h1>⚙️ 설정</h1>
        <p>과일을 눌러서 직접 그려보세요</p>
      </div>
      <div id="fruitEditGrid"></div>
    </section>

    <section id="screen-hub" class="screen">
      <div class="hubTitle">
        <h1 id="hubLogo">🍉 워터메로니</h1>
        <p>맵을 골라 과일을 합쳐보세요</p>
      </div>
      <div id="worldList"></div>
    </section>

    <section id="screen-secret-hub" class="screen">
      <div class="hubTitle">
        <h1>🌌 비밀의 방</h1>
        <p>리믹스 맵을 골라보세요</p>
      </div>
      <div id="secretWorldList"></div>
    </section>

    <section id="screen-stages" class="screen">
      <div class="stagesTitle">
        <h2 id="stagesWorldTitle"></h2>
        <p id="stagesWorldDesc"></p>
      </div>
      <div id="stageMap"></div>
    </section>

    <section id="screen-play" class="screen">
      <div id="playGoal"></div>
      <div id="playArea"></div>
    </section>
  </div>

  <div id="resultOverlay">
    <div class="resultCard">
      <h2 id="resultTitle">STAGE CLEAR!</h2>
      <div class="resultStars" id="resultStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="resultSub" id="resultSub"></div>
      <div class="resultBtns" id="resultBtns"></div>
    </div>
  </div>

  <div id="paintOverlay">
    <div class="paintCard">
      <h2 id="paintTitle">체리 그리기</h2>
      <canvas id="paintCanvas" width="200" height="200"></canvas>
      <div id="paintPalette"></div>
      <div class="resultBtns">
        <button id="paintClearBtn" class="pz-btn secondary">지우기</button>
        <button id="paintResetBtn" class="pz-btn secondary">기본으로</button>
        <button id="paintSaveBtn" class="pz-btn">완료</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= Starfield background ================= */
(function buildStars(){
  const field = document.getElementById('starfield');
  const n = 70;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.2+0.6;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.background = Math.random()<0.5 ? '#ffe066' : '#ffb37a';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    field.appendChild(s);
  }
})();

/* ================= Audio ================= */
let audioCtx = null, muted = false;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq,dur,type,vol,when){
  if(muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + (when||0);
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol||0.15,t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxClick(){ beep(500,0.06,'triangle',0.1); }
function sfxGood(){ beep(600,0.1,'sine',0.14); beep(900,0.12,'sine',0.1,0.06); }
function sfxBad(){ beep(180,0.18,'sawtooth',0.12); }
function sfxWin(){ beep(523,0.14,'sine',0.16); beep(659,0.14,'sine',0.14,0.1); beep(784,0.22,'sine',0.16,0.2); }
function sfxLose(){ beep(260,0.2,'sawtooth',0.14); beep(160,0.3,'sawtooth',0.14,0.15); }
document.getElementById('muteBtnG').addEventListener('click', function(){
  muted = !muted; this.textContent = muted?'🔇':'🔊';
});

/* ================= Save / Progress ================= */
const SAVE_KEY = 'puzzleGalaxy_save_v1';
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||{}; }catch(e){ return {}; } }
let save = loadSave();
function writeSave(){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
function getStars(worldId, idx){ return (save[worldId] && save[worldId][idx]) || 0; }
function setStars(worldId, idx, stars){
  if(!save[worldId]) save[worldId] = [0,0,0,0,0];
  if(stars > save[worldId][idx]){ save[worldId][idx] = stars; writeSave(); }
}
function worldTotalStars(worldId){ return (save[worldId]||[0,0,0,0,0]).reduce((a,b)=>a+b,0); }

/* ================= Custom fruit skins ================= */
const FRUIT_DEFS = [
  { r:14, color:'#ff6b6b', hi:'#ffb3b3', score:1, name:'체리' },
  { r:19, color:'#ffa94d', hi:'#ffd8a8', score:3, name:'귤' },
  { r:25, color:'#ff922b', hi:'#ffc078', score:6, name:'오렌지' },
  { r:32, color:'#f9d923', hi:'#fff3bf', score:10, name:'레몬' },
  { r:40, color:'#82c91e', hi:'#c0eb75', score:15, name:'라임' },
  { r:49, color:'#ff4d6d', hi:'#ff8fa3', score:21, name:'토마토' },
  { r:59, color:'#e64980', hi:'#faa2c1', score:28, name:'복숭아' },
  { r:71, color:'#9c36b5', hi:'#e599f7', score:36, name:'자두' },
  { r:85, color:'#37b24d', hi:'#8ce99a', score:45, name:'사과' },
  { r:102,color:'#2f9e44', hi:'#69db7c', score:55, name:'배' },
  { r:124,color:'#2b8a3e', hi:'#40c057', score:100, name:'수박' },
];
function customFruitKey(i){ return 'watermeloni_customFruit_'+i; }
function getCustomFruitData(i){ return localStorage.getItem(customFruitKey(i)); }
function setCustomFruitData(i, dataUrl){ if(dataUrl) localStorage.setItem(customFruitKey(i), dataUrl); else localStorage.removeItem(customFruitKey(i)); }

/* ================= World / Stage Definitions ================= */
const WORLDS = [
  { id:'classic', name:'클래식 과일', icon:'🍉', color:'#37b24d', desc:'합쳐서 수박까지! 갈수록 목표가 커져요',
    stages:[
      {drops:44, goal:'tier', tierTarget:4, label:'1단계'},
      {drops:40, goal:'tier', tierTarget:5, label:'2단계'},
      {drops:36, goal:'tier', tierTarget:6, label:'3단계'},
      {drops:34, goal:'tier', tierTarget:7, label:'4단계'},
      {drops:32, goal:'tier', tierTarget:9, label:'🍉 진짜 수박!'},
    ] },
  { id:'bomb', name:'폭탄 과일', icon:'💣', color:'#ff8787', desc:'폭탄 종류가 스테이지마다 늘어나요',
    stages:[
      {drops:28, target:45, bombTypes:['score'], bombChance:0.16, label:'점수 폭탄'},
      {drops:28, target:70, bombTypes:['score','dud'], bombChance:0.16, label:'꽝 폭탄 등장'},
      {drops:30, target:100, bombTypes:['dud','shock'], bombChance:0.18, label:'충격파 폭탄'},
      {drops:30, target:135, bombTypes:['score','dud','shock'], bombChance:0.2, label:'폭탄 3종 세트'},
      {drops:32, target:180, bombTypes:['score','dud','shock'], bombChance:0.24, label:'💥 폭탄 대잔치'},
    ] },
  { id:'obstacle', name:'회전 장애물', icon:'🌀', color:'#748ffc', desc:'통나무가 갈수록 길고 많아져요',
    stages:[
      {drops:28, target:55, obstacleCount:1, obstacleLen:0.2, obstacleSpeed:0.42, label:'통나무 1개'},
      {drops:28, target:85, obstacleCount:1, obstacleLen:0.3, obstacleSpeed:0.48, label:'더 길어진 통나무'},
      {drops:30, target:115, obstacleCount:2, obstacleLen:0.38, obstacleSpeed:0.52, label:'통나무 2개'},
      {drops:30, target:150, obstacleCount:2, obstacleLen:0.44, obstacleSpeed:0.58, label:'더 크고 빠르게'},
      {drops:32, target:195, obstacleCount:3, obstacleLen:0.5, obstacleSpeed:0.65, label:'🌀 회전날 3개'},
    ] },
  { id:'animal', name:'동물농장', icon:'🐘', color:'#ffa94d', desc:'병아리부터 매머드까지! 히트박스도 생긴대로',
    stages:[
      {drops:32, animal:true, goal:'score', target:55, label:'병아리부터 시작'},
      {drops:30, animal:true, goal:'tier', tierTarget:2, label:'양까지!'},
      {drops:30, animal:true, goal:'score', target:125, label:'점수 목표'},
      {drops:28, animal:true, goal:'tier', tierTarget:4, label:'소까지!'},
      {drops:28, animal:true, goal:'tier', tierTarget:6, label:'🦣 매머드 완성!'},
    ] },
  { id:'crusher', name:'압착기 (장애물 V2)', icon:'🔨', color:'#e8590c', desc:'천장에서 압착기가 쿵쿵 내려와요! 갈수록 빠르고 많아져요',
    stages:[

const UNLOCK_THRESHOLDS = [0, 3, 6, 9, 12, 15];
const SECRET_RATIO = 0.75;
function maxPossibleStars(){ return (WORLDS.length-1)*15; }
function secretThreshold(){ return Math.ceil(maxPossibleStars()*SECRET_RATIO); }
function totalStarsAll(){
  return WORLDS.filter(w=>w.id!=='secret').reduce((sum,w)=>sum+worldTotalStars(w.id),0);
}
function isWorldUnlockedIn(list, wi){
  if(wi===0) return true;
  const need = UNLOCK_THRESHOLDS[wi] || 15;
  return worldTotalStars(list[wi-1].id) >= need;
}
function isWorldUnlocked(wi){
  const w = WORLDS[wi];
  if(w.id==='secret') return totalStarsAll() >= secretThreshold();
  return isWorldUnlockedIn(WORLDS, wi);
}
function isStageUnlocked(list, wi, si){
  if(si===0) return true;
  return getStars(list[wi].id, si-1) >= 1;
}

/* ---------- Settings: custom fruit editor ---------- */
function renderFruitEditGrid(){
  const grid = byId('fruitEditGrid');
  grid.innerHTML = '';
  FRUIT_DEFS.forEach((f, i)=>{
    const tile = document.createElement('div');
    tile.className = 'fruitEditTile';
    const canvas = document.createElement('canvas');
    canvas.width=56; canvas.height=56;
    const cx = canvas.getContext('2d');
    const data = getCustomFruitData(i);
    if(data){
      const img = new Image();
      img.onload = function(){
        cx.clearRect(0,0,56,56);
        cx.save(); cx.beginPath(); cx.arc(28,28,26,0,Math.PI*2); cx.clip();
        cx.drawImage(img,0,0,56,56); cx.restore();
      };
      img.src = data;
    } else {
      const grad = cx.createRadialGradient(18,18,4,28,28,26);
      grad.addColorStop(0,f.hi); grad.addColorStop(1,f.color);
      cx.beginPath(); cx.arc(28,28,26,0,Math.PI*2); cx.fillStyle=grad; cx.fill();
    }
    const label = document.createElement('span');
    label.textContent = f.name;
    tile.appendChild(canvas); tile.appendChild(label);
    tile.addEventListener('click', function(){ sfxClick(); ensureAudio(); openPaintEditor(i); });
    grid.appendChild(tile);
  });
}
const PAINT_COLORS = ['#ff6b6b','#ffa94d','#ffd43b','#82c91e','#4dabf7','#845ef7','#e64980','#495057','#ffffff','#2b2450'];
let paintTierIndex = 0, paintColor = '#ff6b6b';
function buildPaintPalette(){
  const wrap = byId('paintPalette');
  wrap.innerHTML = '';
  PAINT_COLORS.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'paintSwatch' + (c===paintColor?' on':'');
    sw.style.background = c;
    sw.addEventListener('click', function(){ paintColor=c; buildPaintPalette(); });
    wrap.appendChild(sw);
  });
}
const paintCanvas = byId('paintCanvas');
const paintCtx = paintCanvas.getContext('2d');
let painting=false, lastPaintPt=null;
function paintCanvasPos(e){
  const rect = paintCanvas.getBoundingClientRect();
  let clientX,clientY;
  if(e.touches && e.touches.length){ clientX=e.touches[0].clientX; clientY=e.touches[0].clientY; }
  else if(e.changedTouches && e.changedTouches.length){ clientX=e.changedTouches[0].clientX; clientY=e.changedTouches[0].clientY; }
  else { clientX=e.clientX; clientY=e.clientY; }
  return [ (clientX-rect.left)*(paintCanvas.width/rect.width), (clientY-rect.top)*(paintCanvas.height/rect.height) ];
}
function paintDot(x,y){ paintCtx.fillStyle=paintColor; paintCtx.beginPath(); paintCtx.arc(x,y,7,0,Math.PI*2); paintCtx.fill(); }
function paintLine(x1,y1,x2,y2){ paintCtx.strokeStyle=paintColor; paintCtx.lineWidth=14; paintCtx.lineCap='round'; paintCtx.beginPath(); paintCtx.moveTo(x1,y1); paintCtx.lineTo(x2,y2); paintCtx.stroke(); }
function paintDown(e){ ensureAudio(); painting=true; const p=paintCanvasPos(e); lastPaintPt=p; paintDot(p[0],p[1]); e.preventDefault(); }
function paintMove(e){ if(!painting) return; const p=paintCanvasPos(e); paintLine(lastPaintPt[0],lastPaintPt[1],p[0],p[1]); lastPaintPt=p; e.preventDefault(); }
function paintUp(){ painting=false; }
paintCanvas.addEventListener('mousedown', paintDown);
paintCanvas.addEventListener('mousemove', paintMove);
window.addEventListener('mouseup', paintUp);
paintCanvas.addEventListener('touchstart', paintDown, {passive:false});
paintCanvas.addEventListener('touchmove', paintMove, {passive:false});
paintCanvas.addEventListener('touchend', paintUp);
function openPaintEditor(i){
  paintTierIndex = i;
  const f = FRUIT_DEFS[i];
  byId('paintTitle').textContent = f.name+' 그리기';
  paintCtx.clearRect(0,0,200,200);
  const data = getCustomFruitData(i);
  if(data){
    const img = new Image();
    img.onload = function(){ paintCtx.drawImage(img,0,0,200,200); };
    img.src = data;
  } else {
    const grad = paintCtx.createRadialGradient(70,70,10,100,100,95);
    grad.addColorStop(0,f.hi); grad.addColorStop(1,f.color);
    paintCtx.beginPath(); paintCtx.arc(100,100,95,0,Math.PI*2); paintCtx.fillStyle=grad; paintCtx.fill();
  }
  buildPaintPalette();
  byId('paintOverlay').classList.add('show');
}

const _emojiShapeCache = {};
function measureEmojiShape(emoji){
  if(_emojiShapeCache[emoji]) return _emojiShapeCache[emoji];
  const size=64;
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const cx=c.getContext('2d');
  cx.font=(size*0.85)+'px sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(emoji, size/2, size/2);
  let minX=size,maxX=0,minY=size,maxY=0,found=false;
  try{
    const data=cx.getImageData(0,0,size,size).data;
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        if(data[(y*size+x)*4+3]>20){
          found=true;
          if(x<minX)minX=x; if(x>maxX)maxX=x;
          if(y<minY)minY=y; if(y>maxY)maxY=y;
        }
      }
    }
  }catch(e){}
  const result = found ? {wRatio:Math.max(0.35,(maxX-minX+1)/size), hRatio:Math.max(0.35,(maxY-minY+1)/size)} : {wRatio:0.8,hRatio:0.8};
  _emojiShapeCache[emoji]=result;
  return result;
}

  function spawnParticles(x,y,color,n,spdMul){

  function addFloat(x,y,text,color){ floatTexts.push({x,y,text,age:0,life:0.9,color:color||'#ffe066'}); }

  function curShape(){ return currentIndex===-1 ? {rx:BOMB_R,ry:BOMB_R} : shapeFor(SKIN[currentIndex]); }

  function obstacleBlades(){

  function resolveObstacle(b){
    for(const bl of obstacleBlades()){
      const dx=bl.x2-bl.x1, dy=bl.y2-bl.y1, len2=dx*dx+dy*dy;
      let t=((b.x-bl.x1)*dx+(b.y-bl.y1)*dy)/len2;
      t=Math.max(0,Math.min(1,t));
      const px=bl.x1+t*dx, py=bl.y1+t*dy;
      const distX=b.x-px, distY=b.y-py, dist=Math.hypot(distX,distY);
      const barHalf=8, minDist=b.r+barHalf;
      if(dist<minDist){
        const nx = dist>0.01 ? distX/dist : 1, ny = dist>0.01 ? distY/dist : 0;

        const radius=Math.hypot(px-bl.cx,py-bl.cy);
        const tSpeed=(cfg.obstacleSpeed||0.7)*radius;
        const tx=-Math.sin(bl.ang), ty=Math.cos(bl.ang);
        const dir = ((tx*(b.x-bl.cx)+ty*(b.y-bl.cy))>=0) ? 1 : -1;

  function crusherYAt(i, t){

  }
  function resolveCrushers(b){

    if(Math.floor(b.x/colW)!==col) {}

      const x0=i*colW, x1=(i+1)*colW;

  function meteorImpact(m){
    if(m.dead) return;

    for(const other of bodies){

  function updateMeteors(dt){

        if(dist < b.r+m.r){ meteorImpact(m); break; }
      }
      if(m.y>simH+50) m.dead=true;
      m.trail.forEach(t=>t.age+=dt);
      m.trail=m.trail.filter(t=>t.age<0.25);
    }
    meteors=meteors.filter(m=>!m.dead);
  }
  function detonate(bomb, silent){
    bomb.merging=true;
    let bonus=0;
    if(bomb.bombType==='nuke'){
      for(const other of bodies){
        if(other===bomb || other.merging) continue;
        other.merging=true;
        if(!other.isBomb) bonus += (SKIN[other.index]?SKIN[other.index].score:0)*1.2;
        spawnParticles(other.x,other.y, other.isBomb?'#ff6b6b':SKIN[other.index].color, 8, 1.4);
      }
      score += Math.round(bonus)+20;
      addFloat(bomb.x, bomb.y-BOMB_R-10, '☢️ NUKE! +'+(Math.round(bonus)+20), '#ff0000');
      beep(45,0.6,'sawtooth',0.3); beep(30,0.7,'sawtooth',0.24,0.12); beep(900,0.15,'square',0.15,0.02);
      shake = Math.max(shake, 30);
      nukeFlash = 1;
      shockRings.push({x:bomb.x,y:bomb.y,r:BOMB_R,age:0});
      updateHud();
      if(cfg.goal!=='tier' && score>=cfg.target && !ended) endWin();
      spawnParticles(bomb.x,bomb.y,'#ff0000',40,2.6);
      spawnParticles(bomb.x,bomb.y,'#ffe066',24,2.0);
      return;
    }
    if(!silent){
      for(const other of bodies){
        if(other===bomb || other.merging) continue;
        const dist=Math.hypot(other.x-bomb.x, other.y-bomb.y);
        if(dist < 90+other.r){
          other.merging=true;
          if(!other.isBomb && bomb.bombType==='score') bonus += (SKIN[other.index] ? SKIN[other.index].score : 0)*1.4;
          spawnParticles(other.x,other.y, other.isBomb?'#ff6b6b':SKIN[other.index].color, 6, 0.8);
        }
      }
    }
    if(bomb.bombType==='shock'){
      for(const other of bodies){
        if(other===bomb || other.merging) continue;
        const dx=other.x-bomb.x, dy=other.y-bomb.y, dist=Math.max(20,Math.hypot(dx,dy));
        if(dist<160){
          const force=(160-dist)*9;
          other.vx += (dx/dist)*force; other.vy += (dy/dist)*force;
          kick(other, (dx>0?1:-1)*3);
        }
      }
      addFloat(bomb.x, bomb.y-BOMB_R-10, '💨 충격파!', '#ff6b6b');
      beep(70,0.32,'sine',0.2);
    } else if(bomb.bombType==='dud'){
      addFloat(bomb.x, bomb.y-BOMB_R-10, '꽝!', '#868e96');
      beep(120,0.2,'triangle',0.14);
    } else {
      score += Math.round(bonus)+5;
      addFloat(bomb.x, bomb.y-BOMB_R-10, '💥 +'+(Math.round(bonus)+5), '#ffa8a8');
      beep(90,0.28,'sawtooth',0.22); beep(60,0.35,'sawtooth',0.18,0.05);
      updateHud();
      if(cfg.goal!=='tier' && score>=cfg.target && !ended) endWin();
    }
    spawnParticles(bomb.x,bomb.y, bomb.bombType==='score'?'#ff922b':bomb.bombType==='shock'?'#ff6b6b':'#868e96', 20, 1.4);
    shake = Math.max(shake, 10);
  }

  function separationPass(){
    for(let i=0;i<bodies.length;i++){
      const a=bodies[i]; if(a.merging||a.isBomb) continue;
      for(let j=i+1;j<bodies.length;j++){
        const b=bodies[j]; if(b.merging||b.isBomb) continue;
        let dx=b.x-a.x; const dy=b.y-a.y;
        if(Math.abs(dx)<1.2 && Math.abs(dy)<(a.ry+b.ry)) dx += (a.id%2===0?1:-1)*1.2;
        const dist=Math.hypot(dx,dy)||0.001;
        const angle=Math.atan2(dy,dx);
        const ea=effRadius(a,angle), eb=effRadius(b,angle), minDist=ea+eb;
        if(dist<minDist){
          const overlap=(minDist-dist)/2, nx=dx/dist, ny=dy/dist, total=ea+eb, aR=eb/total, bR=ea/total;
          a.x-=nx*overlap*aR*2; a.y-=ny*overlap*aR*2; b.x+=nx*overlap*bR*2; b.y+=ny*overlap*bR*2;
          if(overlap>1.5){ kick(a,-overlap*0.06); kick(b,overlap*0.06); }
        }
      }
    }
  }

  function step(dt){
    dt=Math.min(dt,1/30);
    totalT += dt;
    if(cfg.obstacleCount) obstacleAngle += dt*(cfg.obstacleSpeed||0.7);
    updateMeteors(dt);
    for(const b of bodies){
      if(b.merging) continue;
      b.spawnT+=dt; b.drawScale=0.6+0.4*Math.min(1,b.spawnT/0.15);
      b.angVel += (-b.rot*9 - b.angVel*3.5)*dt; b.rot += b.angVel*dt;
      if(b.isBomb && b.bombType==='shock' && b.fusing){
        b.fuseTimer -= dt;
        if(b.fuseTimer<=0){ detonate(b, true); continue; }
      }
      b.vy+=GRAVITY*(b.weight||1)*dt;
      if(cfg.windForce) b.vx += Math.sin(totalT*0.9+windPhase)*cfg.windForce*dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.vx*=DAMPING; b.vy*=DAMPING;
      if(b.x-b.rx<0){ b.x=b.rx; b.vx=-b.vx*WALL_R; kick(b,1); }
      if(b.x+b.rx>simW){ b.x=simW-b.rx; b.vx=-b.vx*WALL_R; kick(b,-1); }
      if(b.y+b.ry>simH){ b.y=simH-b.ry; b.vy=-b.vy*FLOOR_R; if(Math.abs(b.vy)<20) b.vy=0; }
      if(cfg.obstacleCount) resolveObstacle(b);
      if(cfg.crusherCount) resolveCrushers(b);
      if(cfg.laserCount) resolveLasers(b, dt);
    }
    for(let i=0;i<bodies.length;i++){
      const a=bodies[i]; if(a.merging) continue;
      for(let j=i+1;j<bodies.length;j++){
        const b=bodies[j]; if(b.merging) continue;
        let dx=b.x-a.x; const dy=b.y-a.y;
        if(Math.abs(dx)<1.2 && Math.abs(dy)<(a.ry+b.ry) && a.index!==b.index) dx += (a.id%2===0?1:-1)*1.2;
        const dist=Math.hypot(dx,dy)||0.001;
        const angle=Math.atan2(dy,dx);
        const minDist = effRadius(a,angle)+effRadius(b,angle);
        if(dist<minDist){
          if(a.isBomb || b.isBomb){
            const bomb = a.isBomb?a:b, other = a.isBomb?b:a;
            if(bomb.spawnT>0.15 && other.spawnT>0.15){
              if(bomb.bombType==='shock'){
                if(!bomb.fusing){ bomb.fusing=true; bomb.fuseTimer=0.8; beep(500,0.05,'square',0.08); }
                const overlap=(minDist-dist), nx=dx/dist, ny=dy/dist;
                bomb.x-=nx*overlap*0.5; bomb.y-=ny*overlap*0.5; other.x+=nx*overlap*0.5; other.y+=ny*overlap*0.5;
              } else {
                detonate(bomb, false);
              }
            }
            continue;
          }
          if(a.index===b.index && a.index<SKIN.length-1){
            a.merging=true; b.merging=true;
            const nx=(a.x+b.x)/2, ny=(a.y+b.y)/2, newIndex=a.index+1, nf=SKIN[newIndex];
            const nb=makeBody(nx,ny,newIndex);
            nb.vx=(a.vx+b.vx)*0.2; nb.vy=(a.vy+b.vy)*0.2-60; nb.spawnT=0.05;
            spawnParticles(nx,ny,nf.color);
            score+=nf.score; addFloat(nx,ny-nb.ry-10,'+'+nf.score);
            beep(260+newIndex*45,0.14,'sine',0.15);
            bodies.push(nb);
            if(newIndex>maxTierEver) maxTierEver=newIndex;
            updateHud();
            if(cfg.goal==='tier'){ if(newIndex>=cfg.tierTarget && !ended) endWin(); }
            else if(score>=cfg.target && !ended){ endWin(); }
          } else {
            const ea=effRadius(a,angle), eb=effRadius(b,angle);
            const overlap=(minDist-dist)/2, nx=dx/dist, ny=dy/dist, total=ea+eb, aR=eb/total, bR=ea/total;
            a.x-=nx*overlap*aR*2; a.y-=ny*overlap*aR*2; b.x+=nx*overlap*bR*2; b.y+=ny*overlap*bR*2;
            const relVx=b.vx-a.vx, relVy=b.vy-a.vy, relDot=relVx*nx+relVy*ny;
            if(relDot<0){
              const imp=-relDot*(1+FRUIT_R);
              a.vx-=imp*nx*bR; a.vy-=imp*ny*bR; b.vx+=imp*nx*aR; b.vy+=imp*ny*aR;
              kick(a,-imp*0.008); kick(b,imp*0.008);
            }
          }
        }
      }
    }
    separationPass(); separationPass();
    bodies=bodies.filter(b=>!b.merging);
    for(const p of particles){ p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=400*dt; }
    particles=particles.filter(p=>p.age<p.life);
    for(const t of floatTexts) t.age+=dt;
    floatTexts=floatTexts.filter(t=>t.age<t.life);
    if(shake>0) shake=Math.max(0,shake-dt*30);
    if(nukeFlash>0) nukeFlash=Math.max(0,nukeFlash-dt*1.8);
    if(shockRings.length){
      for(const r of shockRings){ r.r += dt*820; r.age += dt; }
      shockRings = shockRings.filter(r=>r.age<0.7);
    }

    if(!noSettle){
      let inDanger=false;
      for(const b of bodies){
        if(b.merging) continue;
        b.inDanger = (b.y-b.ry<DANGER_Y && b.spawnT>0.5);
        if(b.inDanger) inDanger=true;
      }
      if(inDanger){
        dangerTimer+=dt;
        dangerBeepTimer -= dt;
        if(dangerBeepTimer<=0){
          beep(880,0.09,'square',0.16);
          dangerBeepTimer = Math.max(0.15, 0.5 - dangerTimer*0.08);
        }
        if(dangerTimer>2.6 && !ended) explodeAndLose();
      } else {
        dangerTimer=Math.max(0,dangerTimer-dt*2);
        dangerBeepTimer = 0.5;
      }
    }

    const goalMet = cfg.goal==='tier' ? maxTierEver>=cfg.tierTarget : score>=cfg.target;
    if(!ended && dropsLeft<=0 && !goalMet){
      if(noSettle || cfg.meteorPeriod || cfg.crusherCount || cfg.laserCount){
        exhaustTimer += dt;
        if(exhaustTimer>1.4) endLose('드롭 횟수를 모두 사용했어요.');
      } else if(bodies.every(b=>Math.abs(b.vy)<5)){
        endLose('드롭 횟수를 모두 사용했어요.');
      }
    }
  }
  function endWin(){
    ended=true;
    let stars;
    if(cfg.goal==='tier'){ stars = dropsLeft>=cfg.drops*0.3 ? 3 : dropsLeft>0 ? 2 : 1; }
    else { const ratio=score/cfg.target; stars = ratio>=2?3:ratio>=1.3?2:1; }
    const sub = cfg.goal==='tier' ? (SKIN[cfg.tierTarget].name+' 완성!') : ('최종 점수 '+score+'점');
    setTimeout(()=>cb.onWin(stars,sub), 400);
  }
  function endLose(msg){
    ended=true;
    if(cfg.infinite){ setTimeout(()=>cb.onInfiniteEnd(score), 300); }
    else { setTimeout(()=>cb.onLose(msg), 300); }
  }
  function explodeAndLose(){
    ended=true;
    for(const b of bodies){
      spawnParticles(b.x, b.y, b.isBomb?'#ff6b6b':(SKIN[b.index]?SKIN[b.index].color:'#ff6b6b'), 10, 1.6);
      b.merging=true;
    }
    bodies=[];
    shake=Math.max(shake, 24);
    beep(60,0.5,'sawtooth',0.26); beep(45,0.6,'sawtooth',0.2,0.12);
    if(cfg.infinite){ setTimeout(()=>cb.onInfiniteEnd(score), 500); }
    else { setTimeout(()=>cb.onLose('과일이 너무 높이 쌓였어요!'), 500); }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0){ ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }
    if(!noSettle){
      ctx.save(); ctx.strokeStyle='rgba(255,80,80,0.5)'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,DANGER_Y); ctx.lineTo(simW,DANGER_Y); ctx.stroke(); ctx.restore();
    }
    if(cfg.obstacleCount){
      for(const bl of obstacleBlades()){
        ctx.save();
        ctx.lineCap='round'; ctx.lineWidth=14; ctx.strokeStyle='rgba(120,80,40,0.9)';
        ctx.beginPath(); ctx.moveTo(bl.x1,bl.y1); ctx.lineTo(bl.x2,bl.y2); ctx.stroke();
        ctx.lineWidth=6; ctx.strokeStyle='rgba(200,150,90,0.9)';
        ctx.beginPath(); ctx.moveTo(bl.x1,bl.y1); ctx.lineTo(bl.x2,bl.y2); ctx.stroke();
        ctx.beginPath(); ctx.arc(bl.cx,bl.cy,9,0,Math.PI*2); ctx.fillStyle='#495057'; ctx.fill();
        ctx.restore();
      }
    }
    if(cfg.crusherCount){
      const colW = simW/cfg.crusherCount;
      for(let i=0;i<cfg.crusherCount;i++){
        const {y:py} = crusherYAt(i, totalT);
        const x0=i*colW+4, x1=(i+1)*colW-4;
        ctx.save();
        ctx.fillStyle='rgba(160,120,70,0.95)';
        ctx.fillRect(x0, py-10, x1-x0, 20);
        ctx.fillStyle='rgba(230,180,110,0.9)';
        ctx.fillRect(x0, py-10, x1-x0, 5);
        ctx.restore();
      }
    }
    if(cfg.laserCount){
      for(let i=0;i<cfg.laserCount;i++){
        const lx = laserXAt(i, totalT);
        ctx.save();
        const grad = ctx.createLinearGradient(lx-6,0,lx+6,0);
        grad.addColorStop(0,'rgba(99,230,190,0)'); grad.addColorStop(0.5,'rgba(99,230,190,0.9)'); grad.addColorStop(1,'rgba(99,230,190,0)');
        ctx.fillStyle=grad;
        ctx.fillRect(lx-6,0,12,simH);
        ctx.restore();
      }
    }
    for(const m of meteors){
      for(const t of m.trail){
        const a=1-t.age/0.25; ctx.save(); ctx.globalAlpha=Math.max(0,a)*0.5; ctx.fillStyle='#ff922b';
        ctx.beginPath(); ctx.arc(t.x,t.y,m.r*0.55,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      ctx.save();
      const grad=ctx.createRadialGradient(m.x,m.y,2,m.x,m.y,m.r);
      grad.addColorStop(0,'#fff3bf'); grad.addColorStop(0.5,'#ff922b'); grad.addColorStop(1,'#e8590c');
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
      ctx.restore();
    }
    for(const b of bodies){
      const scale=(b.drawScale||1);
      drawFruit(b.x,b.y,b.rx*scale,b.ry*scale,b.index,undefined,b.bombType,b.fusing,b.rot,b.inDanger);
    }
    for(const r of shockRings){
      const a = Math.max(0, 1-r.age/0.7);
      ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=Math.max(2,10*(1-r.age)); ctx.strokeStyle='#ffe066';
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=a*0.6; ctx.lineWidth=Math.max(1,20*(1-r.age)); ctx.strokeStyle='#ff0000';
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r*0.85,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    for(const p of particles){
      const a=1-p.age/p.life; ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3.5,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    for(const t of floatTexts){
      const a=1-t.age/t.life; ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=t.color;
      ctx.font='bold 15px Segoe UI, sans-serif'; ctx.textAlign='center';
      ctx.fillText(t.text, t.x, t.y - t.age*30); ctx.restore();
    }
    if(!ended){
      const {rx,ry}=curShape();
      ctx.save(); ctx.globalAlpha=0.9; ctx.setLineDash([4,6]); ctx.strokeStyle='rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(dropX,ry*2+8); ctx.lineTo(dropX,simH); ctx.stroke(); ctx.restore();
      drawFruit(dropX,ry+4,rx,ry,currentIndex,canDrop?1:0.5,currentBombType,false,0);
      if(nextIndex!==-1){
        const nf = SKIN[nextIndex];
        const nr = Math.min(16, nf.r*0.55);
        const nbx = simW-30, nby = 30;
        ctx.save();
        ctx.fillStyle='rgba(20,12,6,0.55)';
        ctx.beginPath(); ctx.arc(nbx,nby,23,0,Math.PI*2); ctx.fill();
        ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.stroke();
        ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#ffe066';
        ctx.fillText('NEXT', nbx, nby-15);
        ctx.restore();
        drawFruit(nbx,nby+3,nr,nr,nextIndex,1,nextBombType,false,0);
      }
    }
    if(nukeFlash>0){
      ctx.save(); ctx.globalAlpha=nukeFlash*0.85; ctx.fillStyle='#fff';
      ctx.fillRect(-40,-40,simW+80,simH+80);
      ctx.restore();
    }
    ctx.restore();
  }
  let raf=null, lastT=performance.now();
  function loop(now){
    const dt=(now-lastT)/1000; lastT=now;
    if(!ended) step(dt);
    render();
    raf=requestAnimationFrame(loop);
  }
  resize(); dropX=simW/2;
  currentIndex=randomDropIndex(); currentBombType = currentIndex===-1?pickBombType():null;
  nextIndex=randomDropIndex(); nextBombType = nextIndex===-1?pickBombType():null;
  updateHud();
  raf=requestAnimationFrame(loop);
  const onResize=()=>resize();
  window.addEventListener('resize', onResize);

  return {
    destroy(){
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('mouseup', onUp);
    }
  };
}


/* ================= Init ================= */
byId('lobbyPlayBtn').addEventListener('click', function(){ sfxClick(); ensureAudio(); goHub(); });
byId('lobbyInfiniteBtn').addEventListener('click', function(){ sfxClick(); ensureAudio(); startInfinite(); });
byId('lobbySettingsBtn').addEventListener('click', function(){ sfxClick(); ensureAudio(); goSettings(); });
byId('lobbyBestScore').textContent = getInfiniteBest();
renderHub();
showScreen('lobby');

})();
</script>
